<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Bug_Storm game presentation</title>
  <desc id="desc">Five-panel layout with the real bitmap gameplay framebuffer, ranking, controls, game objects and a board-image placeholder.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="35%" r="85%"><stop stop-color="#102c4a"/><stop offset=".48" stop-color="#080f25"/><stop offset="1" stop-color="#010207"/></radialGradient>
    <radialGradient id="nebulaP"><stop stop-color="#a855f7" stop-opacity=".3"/><stop offset=".5" stop-color="#6d28d9" stop-opacity=".12"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient>
    <radialGradient id="nebulaC"><stop stop-color="#22d3ee" stop-opacity=".25"/><stop offset=".5" stop-color="#0369a1" stop-opacity=".1"/><stop offset="1" stop-color="#082f49" stop-opacity="0"/></radialGradient>
    <linearGradient id="gameFrame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17354b"/><stop offset="1" stop-color="#07101b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".65"/></filter>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0v25" fill="none" stroke="#16405b" stroke-width=".5" opacity=".25"/></pattern>
    <style>
      .pixel{shape-rendering:crispEdges}.title{font:800 46px monospace;fill:#f8fafc;letter-spacing:4px}.subtitle{font:700 12px monospace;fill:#22d3ee;letter-spacing:2px}.panel{fill:#060d18;stroke:#1c6686;stroke-width:2}.panelHead{fill:#0d2a3d}.panelTitle{font:800 13px monospace;fill:#67e8f9;letter-spacing:1px}.text{font:700 10px monospace;fill:#cbd5e1}.tiny{font:700 8px monospace;fill:#94a3b8}.micro{font:700 7px monospace;fill:#94a3b8}.rank{font:800 11px monospace;fill:#e2e8f0}.key{fill:#0d2435;stroke:#22d3ee;stroke-width:1.5}.keyText{font:800 9px monospace;fill:#f8fafc}.dash{fill:#030812;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}
      @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes drift{0%,100%{opacity:.55}50%{opacity:1}}@keyframes hover{0%,100%{transform:translateY(3px)}50%{transform:translateY(-4px)}}@keyframes march{0%,100%{transform:translateX(-5px)}50%{transform:translateX(6px)}}@keyframes fall{0%{transform:translateY(-8px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(18px);opacity:0}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.45}90%{opacity:.45}100%{transform:translateY(181px);opacity:0}}@keyframes rowGlow{0%,100%{fill:#081522}50%{fill:#12384a}}
      .stars{animation:twinkle 3s ease-in-out infinite}.nebula{animation:drift 8s ease-in-out infinite}.shipLive,.bossLive{animation:hover 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.bugLive{animation:march 2s steps(2,end) infinite;transform-box:fill-box}.eggLive{animation:fall 2s linear infinite;transform-box:fill-box}.giftLive{animation:pulse 1.4s ease-in-out infinite}.scanline{animation:scan 3.2s linear infinite}.rankLive{animation:rowGlow 2.4s ease-in-out infinite}
    </style>
    <symbol id="ship" viewBox="0 0 11 7"><path fill="currentColor" d="M5 0h1v1H5zM4 1h1v1H4zM3 2h1v2H3zM2 4h1v1H2zM1 5h1v1H1zM0 6h11v1H0zM6 1h1v1H6zM7 2h1v2H7zM8 4h1v1H8zM9 5h1v1H9zM4 3h3v4H4z"/></symbol>
    <symbol id="bug" viewBox="0 0 10 7"><path fill="currentColor" d="M3 1h4v5H3zM2 0h1v1H2zM7 0h1v1H7zM0 0h1v1H0zM1 1h2v1H1zM7 1h2v1H7zM9 0h1v1H9zM2 6h1v1H2zM4 6h1v1H4zM6 6h1v1H6zM8 6h1v1H8z"/><path fill="#060d18" d="M4 2h1v1H4zM6 2h1v1H6z"/></symbol>
    <symbol id="egg" viewBox="0 0 3 4"><path fill="currentColor" d="M1 0h1v1H1zM0 1h1v1H0zM2 1h1v1H2zM1 2h1v2H1z"/></symbol>
    <symbol id="gift" viewBox="0 0 5 5"><path fill="currentColor" d="M0 0h5v1H0zM0 4h5v1H0zM0 1h1v3H0zM4 1h1v3H4zM2 2h1v1H2z"/></symbol>
    <symbol id="boss" viewBox="0 0 30 18"><rect x="5" y="3" width="20" height="11" rx="4" fill="currentColor"/><path fill="currentColor" d="M12 1h1v1h-1zM13 2h1v1h-1zM16 0h1v2h-1zM17 2h1v1h-1zM0 1h1v1H0zM1 2h1v1H1zM2 3h2v1H2zM4 4h1v1H4zM5 5h1v1H5zM24 5h1v1h-1zM25 4h1v1h-1zM26 3h1v1h-1zM27 2h1v1h-1zM28 1h1v1h-1zM25 7h1v1h-1zM26 8h2v1h-2zM28 9h2v1h-2zM10 14h1v1h-1zM9 15h1v2H9zM8 17h1v1H8zM19 14h1v1h-1zM20 15h1v2h-1zM21 17h1v1h-1z"/><path fill="#060d18" d="M10 6h1v1h-1zM19 6h1v1h-1z"/></symbol>
  </defs>

  <rect width="900" height="610" fill="url(#space)"/><ellipse class="nebula" cx="70" cy="230" rx="340" ry="270" fill="url(#nebulaP)"/><ellipse class="nebula" cx="840" cy="250" rx="360" ry="280" fill="url(#nebulaC)" style="animation-delay:-4s"/><rect width="900" height="610" fill="url(#grid)"/>
  <g class="stars" fill="#fff"><circle cx="28" cy="38" r="1"/><circle cx="92" cy="77" r="1.4"/><circle cx="155" cy="31" r=".8"/><circle cx="226" cy="82" r="1.2"/><circle cx="300" cy="25" r=".7"/><circle cx="375" cy="72" r="1.3"/><circle cx="511" cy="30" r="1"/><circle cx="603" cy="76" r=".8"/><circle cx="714" cy="31" r="1.4"/><circle cx="802" cy="82" r="1"/><circle cx="875" cy="40" r="1.4"/><circle cx="17" cy="302" r="1"/><circle cx="885" cy="284" r="1.2"/><circle cx="72" cy="579" r=".8"/><circle cx="822" cy="572" r="1"/></g>
  <text x="450" y="50" text-anchor="middle" class="subtitle">STM32L151 / 128 x 64 OLED / VERTICAL ARCADE</text><text x="450" y="96" text-anchor="middle" class="title">BUG_STORM</text><path d="M285 109h330" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>

  <!-- OBJECTS FRAME -->
  <g filter="url(#shadow)"><rect x="24" y="126" width="206" height="204" rx="9" class="panel"/><path d="M24 135a9 9 0 0 1 9-9h188a9 9 0 0 1 9 9v29H24z" class="panelHead"/><text x="127" y="151" text-anchor="middle" class="panelTitle">GAME OBJECTS</text>
    <g class="shipLive" color="#22d3ee"><use href="#ship" x="39" y="178" width="44" height="28"/></g><text x="61" y="220" text-anchor="middle" class="micro">SHIP 11x7</text>
    <rect x="109" y="179" width="8" height="28" fill="#22d3ee"/><text x="113" y="220" text-anchor="middle" class="micro">BULLET 2x4</text>
    <g class="bugLive" color="#e879f9"><use href="#bug" x="154" y="178" width="40" height="28"/></g><text x="174" y="220" text-anchor="middle" class="micro">BUG 10x7</text>
    <g class="eggLive" color="#e879f9"><use href="#egg" x="45" y="249" width="15" height="20"/></g><text x="52" y="286" text-anchor="middle" class="micro">EGG 3x4</text>
    <g class="giftLive" color="#fbbf24"><use href="#gift" x="91" y="245" width="25" height="25"/></g><text x="103" y="286" text-anchor="middle" class="micro">GIFT 5x5</text>
    <g class="bossLive" color="#fbbf24"><use href="#boss" x="137" y="235" width="72" height="43"/></g><text x="173" y="295" text-anchor="middle" class="micro">BOSS 30x18</text>
  </g>

  <!-- BOARD PLACEHOLDER FRAME -->
  <g filter="url(#shadow)"><rect x="24" y="354" width="206" height="220" rx="9" class="panel"/><path d="M24 363a9 9 0 0 1 9-9h188a9 9 0 0 1 9 9v29H24z" class="panelHead"/><text x="127" y="379" text-anchor="middle" class="panelTitle">HARDWARE BOARD</text>
    <rect x="42" y="410" width="170" height="128" rx="5" class="dash"/><rect x="91" y="438" width="72" height="51" rx="5" fill="none" stroke="#64748b" stroke-width="3"/><circle cx="127" cy="463" r="12" fill="none" stroke="#64748b" stroke-width="3"/><path d="m101 438 8-10h36l8 10" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="127" y="513" text-anchor="middle" class="text">ADD BOARD IMAGE</text><text x="127" y="529" text-anchor="middle" class="micro">Replace this placeholder later</text>
  </g>

  <!-- CENTRAL BITMAP GAMEPLAY FRAME -->
  <g filter="url(#shadow)"><rect x="240" y="126" width="420" height="448" rx="18" fill="url(#gameFrame)" stroke="#22d3ee" stroke-width="3"/><rect x="254" y="140" width="392" height="420" rx="11" fill="#020409" stroke="#375d72" stroke-width="2"/>
    <text x="450" y="165" text-anchor="middle" class="panelTitle">REAL PROJECT BITMAP</text><text x="450" y="181" text-anchor="middle" class="tiny">128 x 64 / EXACT 3x SCALE / NO REDRAW</text>
    <rect x="257" y="191" width="386" height="196" fill="#000" stroke="#f8fafc" stroke-width="2"/><image href="data:image/png;base64," x="258" y="193" width="384" height="192" preserveAspectRatio="none" image-rendering="pixelated"/>
    <rect x="276" y="401" width="348" height="1" fill="#1c6686"/><text x="293" y="425" class="subtitle">S</text><text x="311" y="425" class="text">SCORE</text><text x="382" y="425" class="subtitle">W</text><text x="400" y="425" class="text">WAVE</text><text x="471" y="425" class="subtitle">P</text><text x="489" y="425" class="text">POWER</text><text x="564" y="425" class="subtitle">V</text><text x="582" y="425" class="text">LIVES</text>
    <rect x="287" y="449" width="326" height="78" rx="7" fill="#071522" stroke="#16405b"/><text x="450" y="471" text-anchor="middle" class="panelTitle">MISSION</text><text x="450" y="491" text-anchor="middle" class="text">CLEAR 18 BUGS - DEFEAT THE BOSS</text><text x="450" y="509" text-anchor="middle" class="text">COLLECT GIFTS - POWER UP TO 4</text>
    <circle cx="263" cy="149" r="4" fill="#fbbf24"/><circle cx="637" cy="149" r="4" fill="#fbbf24"/><circle cx="263" cy="551" r="4" fill="#fbbf24"/><circle cx="637" cy="551" r="4" fill="#fbbf24"/>
  </g>

  <!-- RANKING FRAME -->
  <g filter="url(#shadow)"><rect x="670" y="126" width="206" height="204" rx="9" class="panel"/><path d="M670 135a9 9 0 0 1 9-9h188a9 9 0 0 1 9 9v29H670z" class="panelHead"/><text x="773" y="151" text-anchor="middle" class="panelTitle">HIGH SCORE BITMAP</text>
    <image href="data:image/png;base64," x="681" y="179" width="184" height="92" preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="773" y="294" text-anchor="middle" class="text">GAME OVER / BEST SCORE</text><text x="773" y="312" text-anchor="middle" class="micro">REAL scr_game_over FRAMEBUFFER</text>
  </g>

  <!-- CONTROL MENU FRAME -->
  <g filter="url(#shadow)"><rect x="670" y="354" width="206" height="220" rx="9" class="panel"/><path d="M670 363a9 9 0 0 1 9-9h188a9 9 0 0 1 9 9v29H670z" class="panelHead"/><text x="773" y="379" text-anchor="middle" class="panelTitle">GAME MENU BITMAP</text>
    <rect x="680" y="407" width="186" height="97" fill="#000" stroke="#f8fafc"/><image href="data:image/png;base64," x="681" y="409" width="184" height="92" preserveAspectRatio="none" image-rendering="pixelated"/>
    <text x="773" y="527" text-anchor="middle" class="text">UP/DOWN: SELECT ITEM</text><text x="773" y="545" text-anchor="middle" class="text">MODE: OPEN Bug_Storm</text><text x="773" y="560" text-anchor="middle" class="micro">REAL scr_startup FRAMEBUFFER</text>
  </g>

  <text x="450" y="598" text-anchor="middle" class="tiny">REAL GAME FRAMEBUFFER + CODE-DERIVED OBJECTS + PROJECT PRESENTATION PANELS</text>
</svg>
